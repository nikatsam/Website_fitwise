name: Request Fitwise ACM certificate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  request-certificate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Report non-sensitive OIDC subject claims for trust debugging
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
            core.info(JSON.stringify({
              issuer: payload.iss,
              audience: payload.aud,
              subject: payload.sub,
              repository: payload.repository,
              ref: payload.ref,
              environment: payload.environment,
            }));

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: FitwiseAcmRequest

      - name: Request or reuse apex and www certificate and print DNS validation records
        id: certificate
        shell: bash
        run: |
          set -euo pipefail
          certificate_arn="$(aws acm list-certificates \
            --region us-east-1 \
            --certificate-statuses PENDING_VALIDATION ISSUED \
            --query "CertificateSummaryList[?DomainName=='fitwise.stream' && contains(not_null(SubjectAlternativeNameSummaries, \`[]\`), 'www.fitwise.stream')].CertificateArn | [0]" \
            --output text)"
          if [[ -z "$certificate_arn" || "$certificate_arn" == "None" ]]; then
            certificate_arn="$(aws acm request-certificate \
              --region us-east-1 \
              --domain-name fitwise.stream \
              --subject-alternative-names www.fitwise.stream \
              --validation-method DNS \
              --idempotency-token fitwiseacm20261007 \
              --tags Key=project,Value=fitwise Key=Project,Value=FitWise \
              --query CertificateArn \
              --output text)"
          fi
          echo "certificate_arn=$certificate_arn" >> "$GITHUB_OUTPUT"
          echo "Certificate ARN: $certificate_arn" >> "$GITHUB_STEP_SUMMARY"

          for attempt in {1..12}; do
            records="$(aws acm describe-certificate \
              --region us-east-1 \
              --certificate-arn "$certificate_arn" \
              --query "Certificate.DomainValidationOptions[?DomainName=='fitwise.stream' || DomainName=='www.fitwise.stream']" \
              --output json)"
            if jq -e '[.[] | select(.ResourceRecord != null) | .DomainName] | unique | length == 2' <<< "$records" >/dev/null; then
              break
            fi
            sleep 5
          done
          if ! jq -e '[.[] | select(.ResourceRecord != null) | .DomainName] | unique | length == 2' <<< "$records" >/dev/null; then
            echo "ACM has not returned the DNS validation record yet; inspect the certificate in ACM." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo '### Add both Cloudflare validation records' >> "$GITHUB_STEP_SUMMARY"
          echo 'Create each exact CNAME below in the fitwise.stream zone, DNS only (proxy disabled), TTL Auto. Do not change the apex record yet.' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          jq '[.[] | {DomainName, ResourceRecord}]' <<< "$records" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

# This workflow only requests/reuses an ACM certificate and reports its
# validation CNAMEs. It does not modify Cloudflare DNS or deploy the site.
