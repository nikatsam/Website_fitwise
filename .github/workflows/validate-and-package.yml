name: Validate and package static site

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-static-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify and build static output
        run: npm run verify

      - name: Upload local release candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fitwise-static-site
          path: |
            dist/
            !dist/dev/**
          if-no-files-found: error
          retention-days: 14

# This workflow packages dist/ only. It has no AWS credentials, S3 sync,
# CloudFront invalidation, or deployment action; those require separately
# approved T023 implementation after the T021 release signature.
